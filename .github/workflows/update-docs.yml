name: Update and publish documentation

on:
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:
    inputs:
      scope:
        description: "Documentation source scope"
        type: choice
        required: true
        default: "github"
        options:
          - "github"
          - "docc"
          - "all"
  workflow_call:
    inputs:
      scope:
        description: "Documentation source scope"
        type: string
        required: false
        default: "github"
    secrets:
      PUBLISH_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: "release-documentation"
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DOCC_CONCURRENCY: "48"
      DOCS_SCOPE: ${{ inputs.scope || 'github' }}
    permissions:
      contents: read
      issues: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      base-sha: ${{ github.sha }}
    steps:
      - name: Check out repository without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun ci; then
              exit 0
            fi
            echo "Dependency install failed on attempt ${attempt}; retrying."
            sleep $((attempt * 10))
          done
          echo "::error::Could not install dependencies after 3 attempts."
          exit 1
      - name: Reconcile stable releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run src/cli.ts update --scope="${DOCS_SCOPE}"
      - name: Rebuild pinned documentation after repository changes
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run src/cli.ts build --scope="${DOCS_SCOPE}"
      # Upstream drift never fails this workflow: `bun run update` keeps the
      # previous pin for a project it cannot convert and quarantines individual
      # pages it cannot render, so publication continues. The drift is escalated
      # into a single tracking issue instead, rewritten only when the set of
      # problems changes and closed once every source converts cleanly again.
      - name: Escalate upstream conversion drift
        id: drift
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_LABEL: pipeline-health-${{ inputs.scope || 'github' }}
          ISSUE_TITLE: "Documentation pipeline (${{ inputs.scope || 'github' }}): upstream conversion drift"
        run: |
          set -euo pipefail
          if [[ ! -f build-report.json ]]; then
            echo "::warning::Reconciliation produced no health report; nothing to escalate."
            exit 0
          fi
          healthy="$(jq -r '.healthy' build-report.json)"
          existing="$(gh issue list --state open --label "${HEALTH_LABEL}" --limit 1 --json number --jq '.[0].number // empty')"

          if [[ "${healthy}" == "true" ]]; then
            if [[ -n "${existing}" ]]; then
              gh issue close "${existing}" --comment "Every source converts cleanly again; closed automatically."
            fi
            exit 0
          fi

          bun run src/cli.ts report > issue-body.md
          fingerprint="$(sed -nE 's/^<!-- pipeline-fingerprint: ([0-9a-f]{16}) -->$/\1/p' issue-body.md)"
          if [[ ! "${fingerprint}" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::Generated issue body has no valid 16-character fingerprint."
            exit 1
          fi
          fingerprint_marker="pipeline-fingerprint: ${fingerprint}"

          if [[ -z "${existing}" ]]; then
            gh label create "${HEALTH_LABEL}" --color "d93f0b" --description "Upstream documentation the generator cannot convert yet" --force
            gh issue create --title "${ISSUE_TITLE}" --label "${HEALTH_LABEL}" --body-file issue-body.md
            exit 0
          fi

          if gh issue view "${existing}" --json body --jq '.body' | grep -qF "${fingerprint_marker}"; then
            echo "Tracking issue #${existing} already describes this drift."
            exit 0
          fi
          gh issue edit "${existing}" --body-file issue-body.md
          gh issue comment "${existing}" --body "The set of unconvertible sources changed; the issue body above was updated."
      - name: Upload pipeline health report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "pipeline-health-report"
          path: "build-report.json"
          if-no-files-found: ignore
          retention-days: "7"
      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          bun run src/cli.ts paths --scope="${DOCS_SCOPE}" > generated-paths.txt
          generated=()
          while IFS= read -r target; do
            [[ -n "${target}" ]] || continue
            generated+=("${target}")
          done < generated-paths.txt
          git add -- "${generated[@]}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The artifact carries the path list it was built from, so the job that
      # writes to main replaces exactly the paths this run generated instead of
      # consulting a second, hand-maintained copy of the project list.
      - name: Stage generated changes for the write-isolated job
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _publish
          mkdir -p _publish
          cp generated-paths.txt _publish/generated-paths.txt
          while IFS= read -r generated; do
            [[ -n "${generated}" ]] || continue
            mkdir -p "_publish/$(dirname -- "${generated}")"
            cp -R -- "${generated}" "_publish/${generated}"
          done < generated-paths.txt
      - name: Upload generated changes for the write-isolated job
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "generated-documentation"
          path: "_publish"
          if-no-files-found: error
          retention-days: "1"

  commit:
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The push authenticates with PUBLISH_TOKEN, not github.token, which now
    # only needs to read the repository for the checkout below.
    permissions:
      contents: read
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "main"
          fetch-depth: 0
          persist-credentials: false
      - name: Download generated documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "generated-documentation"
          path: "_generated"
      # main requires the `check` status check, which a direct push cannot
      # satisfy, so this pushes as the repository owner rather than as
      # github-actions[bot]: the ruleset grants admins a bypass. Unlike
      # github.token, a personal access token also triggers CI on the pushed
      # commit, so a non-deterministic snapshot fails loudly on main.
      - name: Commit the generated paths this run produced
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          BASE_SHA: ${{ needs.build.outputs.base-sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          generated=()
          while IFS= read -r target; do
            [[ -n "${target}" ]] || continue
            generated+=("${target}")
          done < _generated/generated-paths.txt
          if [[ ${#generated[@]} -eq 0 ]]; then
            echo "::error::The snapshot carries no path list."
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
            git fetch --quiet origin "${BASE_SHA}"

          # _generated is untracked, so it survives the reset that re-bases each attempt
          # on whatever main currently points at.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD

            # The snapshot describes the projects configured at BASE_SHA. Once main
            # changes what the generator reads, the lock and root indexes here no
            # longer describe main's project set, and writing them would drop a pin
            # for a project whose directory the snapshot never contained. Rebasing
            # cannot repair that: the corpus has to be built again from the new
            # configuration, which the next run does.
            if ! git diff --quiet "${BASE_SHA}" FETCH_HEAD -- config/sources.json src package.json bun.lock; then
              echo "::error::main moved under this run: the generator inputs changed since ${BASE_SHA}, so this snapshot is stale and was discarded. The next scheduled run regenerates from the current main."
              exit 1
            fi

            for target in "${generated[@]}"; do
              rm -rf -- "${target}"
              cp -R -- "_generated/${target}" "${target}"
            done

            git add -- "${generated[@]}"
            if git diff --cached --quiet; then
              echo "main already carries these snapshots; nothing to commit."
              exit 0
            fi

            git commit -m "docs: update stable release snapshots"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; re-applying onto the new main."
          done

          echo "::error::Could not push generated documentation after 3 attempts."
          exit 1
