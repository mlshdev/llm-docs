name: Update and publish documentation

on:
  push:
    branches:
      - "main"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "release-documentation"
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Check out repository without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun ci
      - name: Reconcile stable releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run update
      - name: Rebuild pinned documentation after repository changes
        if: github.event_name != 'schedule'
        run: bun run build
      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- sources.lock.json llms.txt llms-full.txt traefik netbird podman victoriametrics
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated changes for the write-isolated job
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "generated-documentation"
          path: |
            sources.lock.json
            llms.txt
            llms-full.txt
            traefik
            netbird
            podman
            victoriametrics
          if-no-files-found: error
          retention-days: "1"
      - name: Decide whether to publish Pages
        id: publish
        shell: bash
        env:
          CHANGED: ${{ steps.changes.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$CHANGED" == "true" || "$EVENT_NAME" != "schedule" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Pages artifact
        if: steps.publish.outputs.publish == 'true'
        run: bun run site
      - name: Upload Pages artifact
        if: steps.publish.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "_site"
          retention-days: "1"

  commit:
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "main"
          fetch-depth: 0
          persist-credentials: false
      - name: Download generated documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "generated-documentation"
          path: "_generated"
      - name: Commit allowlisted generated paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          # _generated is untracked, so it survives the reset that re-bases each attempt
          # on whatever main currently points at.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD

            rm -rf traefik netbird podman victoriametrics
            cp _generated/sources.lock.json sources.lock.json
            cp _generated/llms.txt llms.txt
            cp _generated/llms-full.txt llms-full.txt
            cp -R _generated/traefik traefik
            cp -R _generated/netbird netbird
            cp -R _generated/podman podman
            cp -R _generated/victoriametrics victoriametrics

            git add -- sources.lock.json llms.txt llms-full.txt traefik netbird podman victoriametrics
            if git diff --cached --quiet; then
              echo "main already carries these snapshots; nothing to commit."
              exit 0
            fi

            git commit -m "docs: update stable release snapshots"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; re-applying onto the new main."
          done

          echo "::error::Could not push generated documentation after 3 attempts."
          exit 1

  deploy:
    if: >-
      ${{ !cancelled()
      && needs.build.result == 'success'
      && needs.commit.result != 'failure'
      && needs.commit.result != 'cancelled'
      && needs.build.outputs.publish == 'true' }}
    needs:
      - build
      - commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
