name: CI

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun ci
      - name: Check generator and outputs
        run: bun run check
      - name: Rebuild pinned documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run build
      - name: Verify deterministic generated output
        run: git diff --exit-code -- sources.lock.json llms.txt llms-full.txt traefik netbird podman
