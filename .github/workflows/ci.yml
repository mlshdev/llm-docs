name: CI

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun ci; then
              exit 0
            fi
            echo "Dependency install failed on attempt ${attempt}; retrying."
            sleep $((attempt * 10))
          done
          echo "::error::Could not install dependencies after 3 attempts."
          exit 1
      - name: Check generator and outputs
        run: bun run check
      - name: Rebuild pinned documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run build
      - name: Verify deterministic generated output
        run: git diff --exit-code -- sources.lock.json llms.txt llms-full.txt traefik netbird podman docker n8n grafana victoriametrics victorialogs victoriametrics-datasource victorialogs-datasource vmestimator zitadel ffmpeg yt-dlp searxng bun
