name: Update Apple documentation

on:
  schedule:
    - cron: "0 20 * * 0"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Shared with update-github-docs.yml: every scope rewrites the same lock file and
# root indexes, so only one publisher may run at a time. On 2026-10-11 the two
# overlapped and the daily publish reverted six DocC pins.
concurrency:
  group: "release-documentation"
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/update-docs.yml
    with:
      scope: "docc"
    secrets: inherit
